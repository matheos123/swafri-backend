# Render Blueprint — Web3 Battle Arena Backend
# Docs: https://render.com/docs/blueprint-spec
#
# After first deploy, set secrets in the Render dashboard:
# JWT_SECRET, JWT_REFRESH_SECRET, PRIVATE_KEY, CORS_ORIGIN, SOCKET_CORS_ORIGIN

services:
  - type: web
    name: swafri-backend
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run render:start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: swafri-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: REDIS_HOST
        value: localhost
      - key: REDIS_PORT
        value: "6379"
      - key: BLOCKCHAIN_RPC_URL
        value: https://rpc-amoy.polygon.technology
      - key: CHAIN_ID
        value: "80002"
      - key: GAME_REWARD_ADDRESS
        value: "0xc6B4Edae0666e59f6475079A58d97483A1fd0d42"
      - key: PRIVATE_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SOCKET_CORS_ORIGIN
        sync: false

databases:
  - name: swafri-postgres
    plan: free
    databaseName: web3_arena
    user: swafri
